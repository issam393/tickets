<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de cas d'utilisation UML - AGCE CRM</title>
  <desc id="desc">Diagramme UML professionnel avec cinq acteurs et les cas d'utilisation du système AGCE CRM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <g id="actor">
      <circle cx="0" cy="-36" r="11" class="actor-line"/>
      <line x1="0" y1="-25" x2="0" y2="10" class="actor-line"/>
      <line x1="-25" y1="-8" x2="25" y2="-8" class="actor-line"/>
      <line x1="0" y1="10" x2="-23" y2="42" class="actor-line"/>
      <line x1="0" y1="10" x2="23" y2="42" class="actor-line"/>
    </g>
    <style>
      .page { fill: #fff; }
      .system { fill: #fff; stroke: #111827; stroke-width: 2.4; }
      .system-title { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .section { fill: #f8fafc; stroke: #d7dee8; stroke-width: 1.2; }
      .section-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .uc { fill: #fff; stroke: #1f2937; stroke-width: 1.6; }
      .uc-alt { fill: #eef6ff; stroke: #1f2937; stroke-width: 1.5; }
      .uc-text { font: 14px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .actor-line { stroke: #111827; stroke-width: 2.1; fill: none; stroke-linecap: round; }
      .actor-text { font: 700 15px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .assoc { stroke: #64748b; stroke-width: 0.95; stroke-opacity: .38; fill: none; }
      .include { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .extend { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; marker-end: url(#arrow); }
      .label { font: italic 12px Arial, Helvetica, sans-serif; fill: #334155; text-anchor: middle; }
      .condition { font: 12px Arial, Helvetica, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1250"/>
  <text x="900" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Diagramme de cas d'utilisation - AGCE CRM</text>

  <!-- Acteurs : exactement cinq acteurs, sans acteur générique Employé -->
  <g transform="translate(135 360)"><use href="#actor"/><text class="actor-text" x="0" y="66">Administrateur</text></g>
  <g transform="translate(135 580)"><use href="#actor"/><text class="actor-text" x="0" y="66">Service Delivery</text></g>
  <g transform="translate(135 800)"><use href="#actor"/><text class="actor-text" x="0" y="66">Service IT</text></g>
  <g transform="translate(135 920)"><use href="#actor"/><text class="actor-text" x="0" y="66">Service PKI</text></g>
  <g transform="translate(135 1090)"><use href="#actor"/><text class="actor-text" x="0" y="66">Manager</text></g>

  <!-- Frontière du système -->
  <rect class="system" x="305" y="75" width="1435" height="1125"/>
  <text class="system-title" x="1022" y="118">AGCE CRM</text>

  <!-- Sections alignées -->
  <rect class="section" x="335" y="145" width="1375" height="120"/>
  <text class="section-title" x="355" y="170">Accès commun aux cinq acteurs</text>
  <rect class="section" x="335" y="290" width="1375" height="135"/>
  <text class="section-title" x="355" y="315">Administration</text>
  <rect class="section" x="335" y="450" width="1375" height="260"/>
  <text class="section-title" x="355" y="475">Gestion client et tickets - Service Delivery</text>
  <rect class="section" x="335" y="735" width="1375" height="180"/>
  <text class="section-title" x="355" y="760">Traitement des tickets - Services IT et PKI</text>
  <rect class="section" x="335" y="940" width="1375" height="190"/>
  <text class="section-title" x="355" y="965">Pilotage consultatif - Manager</text>

  <!-- Accès commun -->
  <ellipse class="uc" cx="495" cy="215" rx="88" ry="30"/><text class="uc-text" x="495" y="215">S'authentifier</text>
  <ellipse class="uc-alt" cx="705" cy="215" rx="116" ry="30"/><text class="uc-text" x="705" y="207">Vérifier l'état actif</text><text class="uc-text" x="705" y="225">du compte</text>
  <ellipse class="uc" cx="945" cy="215" rx="114" ry="30"/><text class="uc-text" x="945" y="207">Accéder au tableau</text><text class="uc-text" x="945" y="225">de bord</text>
  <ellipse class="uc" cx="1195" cy="215" rx="100" ry="30"/><text class="uc-text" x="1195" y="215">Consulter son profil</text>
  <ellipse class="uc" cx="1425" cy="215" rx="92" ry="30"/><text class="uc-text" x="1425" y="215">Se déconnecter</text>

  <!-- Administration -->
  <ellipse class="uc" cx="500" cy="360" rx="95" ry="31"/><text class="uc-text" x="500" y="360">Gérer les employés</text>
  <ellipse class="uc" cx="720" cy="360" rx="88" ry="31"/><text class="uc-text" x="720" y="360">Créer un employé</text>
  <ellipse class="uc" cx="930" cy="360" rx="94" ry="31"/><text class="uc-text" x="930" y="360">Modifier un employé</text>
  <ellipse class="uc" cx="1150" cy="360" rx="100" ry="31"/><text class="uc-text" x="1150" y="360">Désactiver un compte</text>
  <ellipse class="uc" cx="1390" cy="360" rx="108" ry="31"/><text class="uc-text" x="1390" y="352">Gérer les rôles</text><text class="uc-text" x="1390" y="370">et les accès</text>

  <!-- Service Delivery -->
  <ellipse class="uc" cx="505" cy="520" rx="112" ry="32"/><text class="uc-text" x="505" y="512">Gérer les organisations</text><text class="uc-text" x="505" y="530">clientes</text>
  <ellipse class="uc" cx="755" cy="520" rx="104" ry="32"/><text class="uc-text" x="755" y="512">Gérer les contacts</text><text class="uc-text" x="755" y="530">clients</text>
  <ellipse class="uc" cx="995" cy="520" rx="85" ry="32"/><text class="uc-text" x="995" y="520">Créer un ticket</text>
  <ellipse class="uc-alt" cx="1225" cy="485" rx="125" ry="29"/><text class="uc-text" x="1225" y="477">Sélectionner une</text><text class="uc-text" x="1225" y="495">organisation cliente</text>
  <ellipse class="uc-alt" cx="1225" cy="555" rx="112" ry="29"/><text class="uc-text" x="1225" y="547">Sélectionner un</text><text class="uc-text" x="1225" y="565">contact client</text>
  <ellipse class="uc" cx="1480" cy="520" rx="106" ry="32"/><text class="uc-text" x="1480" y="512">Consulter les e-mails</text><text class="uc-text" x="1480" y="530">clients</text>

  <ellipse class="uc" cx="505" cy="645" rx="96" ry="31"/><text class="uc-text" x="505" y="645">Consulter les tickets</text>
  <ellipse class="uc" cx="735" cy="645" rx="90" ry="31"/><text class="uc-text" x="735" y="645">Affecter un ticket</text>
  <ellipse class="uc-alt" cx="950" cy="645" rx="100" ry="31"/><text class="uc-text" x="950" y="645">Historiser l'affectation</text>
  <ellipse class="uc" cx="1180" cy="645" rx="94" ry="31"/><text class="uc-text" x="1180" y="637">Suivre l'état</text><text class="uc-text" x="1180" y="655">d'un ticket</text>
  <ellipse class="uc" cx="1420" cy="645" rx="118" ry="31"/><text class="uc-text" x="1420" y="637">Planifier un meeting</text><text class="uc-text" x="1420" y="655">lié à un ticket</text>

  <!-- IT / PKI -->
  <ellipse class="uc" cx="525" cy="815" rx="122" ry="31"/><text class="uc-text" x="525" y="807">Consulter les tickets</text><text class="uc-text" x="525" y="825">affectés au service IT</text>
  <ellipse class="uc" cx="775" cy="815" rx="95" ry="31"/><text class="uc-text" x="775" y="815">Traiter un ticket IT</text>
  <ellipse class="uc" cx="1025" cy="815" rx="125" ry="31"/><text class="uc-text" x="1025" y="807">Consulter les tickets</text><text class="uc-text" x="1025" y="825">affectés au service PKI</text>
  <ellipse class="uc" cx="1285" cy="815" rx="98" ry="31"/><text class="uc-text" x="1285" y="815">Traiter un ticket PKI</text>
  <ellipse class="uc" cx="650" cy="880" rx="112" ry="29"/><text class="uc-text" x="650" y="880">Ajouter un commentaire</text>
  <ellipse class="uc" cx="910" cy="880" rx="90" ry="29"/><text class="uc-text" x="910" y="880">Résoudre un ticket</text>
  <ellipse class="uc-alt" cx="1155" cy="880" rx="125" ry="29"/><text class="uc-text" x="1155" y="872">Mettre à jour le statut</text><text class="uc-text" x="1155" y="890">du ticket</text>

  <!-- Manager -->
  <ellipse class="uc" cx="515" cy="1030" rx="122" ry="32"/><text class="uc-text" x="515" y="1022">Consulter les tableaux</text><text class="uc-text" x="515" y="1040">de bord analytiques</text>
  <ellipse class="uc" cx="770" cy="1030" rx="124" ry="32"/><text class="uc-text" x="770" y="1022">Suivre les indicateurs</text><text class="uc-text" x="770" y="1040">de performance</text>
  <ellipse class="uc" cx="1020" cy="1030" rx="110" ry="32"/><text class="uc-text" x="1020" y="1022">Consulter l'état</text><text class="uc-text" x="1020" y="1040">des tickets</text>
  <ellipse class="uc" cx="1250" cy="1030" rx="112" ry="32"/><text class="uc-text" x="1250" y="1022">Consulter l'activité</text><text class="uc-text" x="1250" y="1040">des services</text>
  <ellipse class="uc" cx="1480" cy="1030" rx="96" ry="32"/><text class="uc-text" x="1480" y="1030">Consulter les meetings</text>

  <!-- Associations : droits propres par rôle -->
  <path class="assoc" d="M172 360 L405 360"/><path class="assoc" d="M172 360 L632 360"/><path class="assoc" d="M172 360 L836 360"/><path class="assoc" d="M172 360 L1050 360"/><path class="assoc" d="M172 360 L1282 360"/>
  <path class="assoc" d="M172 580 L393 520"/><path class="assoc" d="M172 580 L651 520"/><path class="assoc" d="M172 580 L910 520"/><path class="assoc" d="M172 580 L409 645"/><path class="assoc" d="M172 580 L645 645"/><path class="assoc" d="M172 580 L1086 645"/><path class="assoc" d="M172 580 L1302 645"/><path class="assoc" d="M172 580 L1374 520"/><path class="assoc" d="M172 580 L538 880"/>
  <path class="assoc" d="M172 800 L403 815"/><path class="assoc" d="M172 800 L680 815"/><path class="assoc" d="M172 800 L538 880"/><path class="assoc" d="M172 800 L820 880"/>
  <path class="assoc" d="M172 920 L900 815"/><path class="assoc" d="M172 920 L1187 815"/><path class="assoc" d="M172 920 L538 880"/><path class="assoc" d="M172 920 L820 880"/>
  <path class="assoc" d="M172 1090 L393 1030"/><path class="assoc" d="M172 1090 L646 1030"/><path class="assoc" d="M172 1090 L910 1030"/><path class="assoc" d="M172 1090 L1138 1030"/><path class="assoc" d="M172 1090 L1384 1030"/>

  <!-- Accès commun partagé par les cinq acteurs, sans ajouter l'acteur générique Employé -->
  <path class="assoc" d="M228 360 L270 360 L270 215 L407 215"/>
  <path class="assoc" d="M228 580 L260 580 L260 215 L407 215"/>
  <path class="assoc" d="M228 800 L250 800 L250 215 L407 215"/>
  <path class="assoc" d="M228 920 L240 920 L240 215 L407 215"/>
  <path class="assoc" d="M228 1090 L230 1090 L230 215 L407 215"/>

  <!-- Relations include -->
  <path class="include" d="M583 215 L589 215"/><text class="label" x="640" y="198">&lt;&lt;include&gt;&gt;</text>
  <path class="include" d="M1078 507 L1105 499"/><text class="label" x="1135" y="472">&lt;&lt;include&gt;&gt;</text>
  <path class="include" d="M1078 533 L1112 547"/><text class="label" x="1140" y="585">&lt;&lt;include&gt;&gt;</text>
  <path class="include" d="M825 645 L850 645"/><text class="label" x="850" y="628">&lt;&lt;include&gt;&gt;</text>
  <path class="include" d="M1000 880 L1030 880"/><text class="label" x="1025" y="863">&lt;&lt;include&gt;&gt;</text>

  <!-- Relations extend -->
  <path class="extend" d="M762 879 C775 860 775 842 775 846"/><text class="label" x="735" y="848">&lt;&lt;extend&gt;&gt;</text>
  <path class="extend" d="M760 870 C960 865 1160 840 1195 821"/><text class="label" x="1000" y="842">&lt;&lt;extend&gt;&gt;</text>
  <path class="extend" d="M1420 614 L1272 645"/><text class="label" x="1340" y="612">&lt;&lt;extend&gt;&gt;</text>
  <path class="extend" d="M1378 538 L1078 520"/><text class="label" x="1248" y="535">&lt;&lt;extend&gt;&gt;</text>
  <text class="condition" x="1300" y="555">si ticket créé à partir d'un e-mail</text>
</svg>
